# D3 Edge enforcement via nginx's auth_request — config only, works on any
# stock nginx build. Merge into your server block and fill in the adapter key.
# See README.md in this directory.

# Keepalive to the decision endpoint: auth_request opens a subrequest per
# request, and a fresh TLS handshake each time would eat the whole budget.
upstream d3_edge {
    server edge-api.d3.com:443;
    keepalive 8;
}

server {
    listen 443 ssl;
    server_name example.com;

    location / {
        auth_request /_d3_edge;
        # Fail open: enforcement breaking must never take the site down.
        # error_page only fires on nginx-generated errors — a failed subrequest
        # surfaces as 500 here — so your app's own 500s pass through untouched.
        error_page 500 = @d3_edge_failopen;

        # ...your existing config, e.g.:
        proxy_pass http://backend:3000;
    }

    # Mirror of the main location, minus the check. Named locations preserve
    # the original method and URI.
    location @d3_edge_failopen {
        auth_request off;
        proxy_pass http://backend:3000;
    }

    location = /_d3_edge {
        internal;
        proxy_pass https://d3_edge/v1/forward-auth;

        # Mandatory: without both, the subrequest hangs waiting for a body.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Keepalive needs 1.1 and a cleared Connection header.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Off by default in nginx — an unverified decision call would let
        # anyone who can MITM this hop mint verdicts.
        proxy_ssl_verify on;
        # Debian/Ubuntu path; RHEL/Alpine use /etc/ssl/certs/ca-bundle.crt.
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_set_header Host edge-api.d3.com;

        # The whole decision budget: a hung endpoint degrades like a down one.
        proxy_connect_timeout 150ms;
        proxy_read_timeout 150ms;
        proxy_send_timeout 150ms;

        # The request tuple — auth_request sends nothing on its own.
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Host $host;
        # The pinned client IP — the endpoint never trusts X-Forwarded-For.
        proxy_set_header X-Real-IP $remote_addr;

        # Your org's adapter key (dashboard -> Keys).
        proxy_set_header x-d3-adapter-key "d3_k_REPLACE_ME";

        # Never ours to see. An empty value removes the header.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";

        # A visitor must not pin its own tuple, key, or digest.
        proxy_set_header x-d3-method "";
        proxy_set_header x-d3-host "";
        proxy_set_header x-d3-uri "";
        proxy_set_header x-d3-content-digest "";
    }
}
