# D3 Edge on OpenResty — minimal config around web_bot_auth_verify.lua.
# Requires OpenResty (or nginx built with ngx_http_lua_module) + lua-resty-http.
# See README.md in this directory; docs: https://ai.d3.com/docs/sdks/nginx

# `env` lines must sit in the MAIN context (top of nginx.conf, outside http{})
# or os.getenv() sees nothing — with DNA_API_KEY hidden, the script is a
# silent passthrough.
env DNA_API_KEY;
env DNA_ENABLED;
env DNA_ENDPOINT;
env DNA_TIMEOUT_MS;
env DNA_PAYMENT_TIMEOUT_MS;
env DNA_FAIL_MODE;
# Earlier names, still read; drop these once your environment uses the DNA_ ones.
env POLICY_WORKER_URL;
env POLICY_ADAPTER_KEY;
env POLICY_TIMEOUT_MS;
env POLICY_PAYMENT_TIMEOUT_MS;
env FAIL_MODE;

http {
  # Resolver so lua-resty-http can look up the policy endpoint's hostname.
  resolver 1.1.1.1 8.8.8.8 ipv6=off;

  # Cache compiled Lua across requests (disable only while editing).
  lua_code_cache on;

  # TLS verification for the policy call (ssl_verify = true in the script).
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  lua_ssl_verify_depth 2;

  server {
    listen 80;
    server_name www.example.com;

    location / {
      # Runs before proxying: ask the policy worker, enforce pass/block.
      access_by_lua_file /etc/nginx/lua/web_bot_auth_verify.lua;

      proxy_set_header Host $host;
      proxy_pass http://backend_upstream;
    }
  }
}
